[workspace]
name = "sardine"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

# ============================================================
# Runtime deps only — one feature per language, kept minimal to
# mirror exactly what each package will declare as its own
# dependencies (pyproject.toml / DESCRIPTION), so "user-python"
# and "user-r" below are a close approximation of what an actual
# end user's environment looks like after `pip install sardine-ewas`
# or `install.packages("sardine")`.
# ============================================================

[feature.python-runtime.dependencies]
python = ">=3.10,<3.14"
numpy = "*"
pandas = "*"
scipy = "*"
# not a package dependency — included so `pip install` works inside
# user-python for the built-wheel sanity check, same as a real user's env
pip = "*"

[feature.r-runtime.dependencies]
r-base = "*"
"r-data.table" = "*"

# Install the tarball built by `build-r` (for the current VERSION) and run
# sardine()'s help-page example on the bundled sample data. Run these in
# user-r to confirm the package works with only its declared dependencies.
[feature.r-runtime.tasks]
install-r = '''Rscript -e 'install.packages(file.path("dist", sprintf("sardine_%s.tar.gz", readLines("VERSION")[1])), repos = NULL, type = "source")' '''
example-r = '''Rscript -e 'library(sardine); example(sardine)' '''

# ============================================================
# Dev-only extras, layered on top of the runtime features above.
# ============================================================

[feature.python-dev.dependencies]
pytest = "*"
hatchling = "*"
python-build = "*"
twine = "*"

[feature.python-dev.tasks]
test-py = "pytest python/tests"
build-py = "python -m build python"

[feature.r-dev.dependencies]
r-devtools = "*"
r-usethis = "*"
r-testthat = "*"
r-roxygen2 = "*"
r-covr = "*"
r-pkgdown = "*"

[feature.r-dev.tasks]
document-r = "Rscript -e 'devtools::document(\"r\")'"
# test-r, check-r and build-r first sync VERSION and fixtures/ into r/, so they never use a stale copy
# test-r runs every R test: the shared fixtures plus the R-only tests in r/tests/testthat/
test-r = { cmd = "Rscript -e 'devtools::test(\"r\")'", depends-on = ["sync"] }
check-r = { cmd = "Rscript -e 'devtools::check(\"r\")'", depends-on = ["sync"] }
# writes dist/sardine_<VERSION>.tar.gz
build-r = { cmd = "Rscript -e 'dir.create(\"dist\", showWarnings = FALSE); devtools::build(\"r\", path = \"dist\")'", depends-on = ["sync"] }

# Tasks that maintain the files shared by both packages (VERSION, fixtures/)
[feature.dev-shared.tasks]
# writes the shared expected outputs in fixtures/, using the R package as the reference implementation
generate-fixtures = "Rscript fixtures/generate_fixtures.R"
# copy VERSION and fixtures/ into the R and Python packages; --check only reports but doesn't copy
sync = "python tools/sync.py"
check-sync = "python tools/sync.py --check"

[environments]
# Full contributor box: both languages, runtime + dev tooling.
dev = ["python-runtime", "python-dev", "r-runtime", "r-dev", "dev-shared"]

# Approximates a real end user of the Python package: runtime deps only.
# Install the built wheel/sdist into this env to sanity-check a clean install.
user-python = ["python-runtime"]

# Approximates a real end user of the R package: runtime deps only.
# Install the built tarball into this env to sanity-check a clean install.
user-r = ["r-runtime"]
